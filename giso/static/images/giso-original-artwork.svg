<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- گرادیان‌های اصلی تم Original و برند گیسو صادقی -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfb" />
      <stop offset="50%" stop-color="#fef5f0" />
      <stop offset="100%" stop-color="#fdf0e6" />
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df8f99" />
      <stop offset="50%" stop-color="#c86d7a" />
      <stop offset="100%" stop-color="#a94a59" />
    </linearGradient>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#b49126" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5441" />
      <stop offset="50%" stop-color="#5c3f30" />
      <stop offset="100%" stop-color="#3d281e" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5ec" />
      <stop offset="100%" stop-color="#fce8d8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#a94a59" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- پس‌زمینه دایره‌ای لوکس با حاشیه شامپاینی و سایه نرم -->
  <circle cx="250" cy="250" r="220" fill="url(#bgGrad)" filter="url(#cardShadow)" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="url(#roseGold)" stroke-width="2" opacity="0.45" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#champagneGold)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- کمان‌ها و دایره‌های هوشمند تحلیل تصویری (Smart Analysis Geometry) -->
  <g opacity="0.75">
    <circle cx="250" cy="250" r="160" fill="none" stroke="url(#roseGold)" stroke-width="1" opacity="0.35" />
    <path d="M 90 250 A 160 160 0 0 1 410 250" fill="none" stroke="url(#champagneGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 140 140 A 155 155 0 0 1 360 140" fill="none" stroke="url(#roseGold)" stroke-width="2" stroke-dasharray="4 8" />
    <!-- نقاط اسکن هوشمند (Scan Nodes) -->
    <circle cx="160" cy="135" r="5" fill="url(#champagneGold)" />
    <circle cx="340" cy="135" r="5" fill="url(#champagneGold)" />
    <circle cx="115" cy="240" r="4" fill="url(#roseGold)" />
    <circle cx="385" cy="240" r="4" fill="url(#roseGold)" />
    <circle cx="150" cy="350" r="6" fill="url(#champagneGold)" />
    <circle cx="350" cy="350" r="6" fill="url(#champagneGold)" />
    <!-- خطوط اسکن و تحلیل نوری -->
    <line x1="160" y1="135" x2="215" y2="185" stroke="url(#champagneGold)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="340" y1="135" x2="275" y2="175" stroke="url(#champagneGold)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
    <line x1="385" y1="240" x2="310" y2="245" stroke="url(#roseGold)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" />
  </g>

  <!-- نیم‌رخ ظریف و زنانه با موهای مواج لوکس (Feminine Profile & Flowing Hair) -->
  <g id="womanSilhouette">
    <!-- موج‌های مو پشتی (Background Hair Waves) -->
    <path d="M 220 110 C 290 110, 360 150, 370 230 C 380 300, 350 370, 290 410 C 260 430, 210 425, 185 395 C 195 365, 230 350, 255 330 C 285 305, 320 270, 305 210 C 295 175, 255 155, 220 160 Z" 
          fill="url(#hairGrad)" opacity="0.9" />
    
    <!-- صورت و گردن ظریف زنانه (Face Profile & Neck) -->
    <path d="M 215 155 C 225 155, 238 165, 242 178 C 246 190, 258 200, 262 210 C 265 218, 258 226, 252 230 C 255 236, 264 242, 260 252 C 255 262, 242 270, 240 282 C 238 295, 245 315, 250 335 L 210 350 C 200 330, 195 300, 198 275 C 200 250, 195 230, 195 210 C 195 185, 202 165, 215 155 Z" 
          fill="url(#skinGrad)" stroke="#ebd3d7" stroke-width="1.5" />
    
    <!-- خط چشم و ابروی ظریف -->
    <path d="M 235 188 Q 245 185 252 192" fill="none" stroke="#7a5441" stroke-width="2" stroke-linecap="round" />
    <path d="M 238 198 Q 246 198 250 203" fill="none" stroke="#5c3f30" stroke-width="1.5" stroke-linecap="round" />
    <!-- لب ظریف زنانه -->
    <path d="M 248 234 Q 255 236 249 242" fill="none" stroke="#c86d7a" stroke-width="2" stroke-linecap="round" />

    <!-- موج‌های مو اصلی و جلویی (Foreground Flowing Hair Strands) -->
    <path d="M 205 150 C 170 160, 140 195, 145 245 C 150 295, 180 345, 225 385 C 240 398, 265 410, 285 405 C 260 380, 230 350, 215 315 C 195 270, 190 220, 210 180 Z" 
          fill="url(#hairGrad)" />
    <!-- رشته‌های طلایی هایلایت مو (Rose Gold / Champagne Hair Highlights) -->
    <path d="M 215 160 C 185 185, 175 230, 185 275 C 195 315, 220 355, 255 385" 
          fill="none" stroke="url(#champagneGold)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M 255 150 C 295 175, 315 220, 305 270 C 295 315, 265 355, 240 380" 
          fill="none" stroke="url(#roseGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 230 145 C 260 165, 280 200, 275 240 C 270 280, 245 315, 225 345" 
          fill="none" stroke="#fffdfb" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- المان‌های درخشان زیبایی و هوش مصنوعی (Sparkle & AI Scan Badges) -->
  <g filter="url(#softGlow)">
    <!-- ستاره بزرگ طلایی بالا راست -->
    <path d="M 355 110 L 360 125 L 375 130 L 360 135 L 355 150 L 350 135 L 335 130 L 350 125 Z" fill="url(#champagneGold)" />
    <!-- ستاره کوچک رزگلد پایین چپ -->
    <path d="M 125 330 L 128 340 L 138 343 L 128 346 L 125 356 L 122 346 L 112 343 L 122 340 Z" fill="url(#roseGold)" />
    <!-- ستاره کوچک طلایی بالا چپ -->
    <path d="M 140 170 L 142 177 L 149 179 L 142 181 L 140 188 L 138 181 L 131 179 L 138 177 Z" fill="url(#champagneGold)" opacity="0.8" />
  </g>

  <!-- فریم اسکن هوشمند صورت و مو (AI Scan Focus Frame) -->
  <g stroke="url(#champagneGold)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M 175 185 L 165 185 L 165 195" />
    <path d="M 315 185 L 325 185 L 325 195" />
    <path d="M 165 295 L 165 305 L 175 305" />
    <path d="M 325 295 L 325 305 L 315 305" />
  </g>

  <!-- تگ پایین: GISO SADEGHI - AI BEAUTY -->
  <g transform="translate(250, 435)">
    <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#fffdfb" stroke="url(#roseGold)" stroke-width="1.2" filter="url(#cardShadow)" />
    <text x="0" y="5" text-anchor="middle" font-family="'Vazirmatn', sans-serif" font-size="13" font-weight="700" fill="#4a3b32" letter-spacing="1">GISO SADEGHI</text>
  </g>
</svg>
