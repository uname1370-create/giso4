<form method="post" action="{{ url_for('submit_buyer_request') }}" class="pu-buyer-request-form" data-buyer-request-form><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="pu-form-grid">
    <label><span>نام و نام خانوادگی <b>*</b></span><input name="buyer_name" type="text" maxlength="150" required value="{{ (buyer_request.request_name if buyer_request else user.name) or '' }}" autocomplete="name"></label>
    <label><span>شماره تماس <b>*</b></span><input name="buyer_phone" type="tel" maxlength="11" required value="{{ (buyer_request.request_phone if buyer_request else user.phone) or '' }}" inputmode="tel" dir="ltr" autocomplete="tel"></label>
    <label><span>شهر <b>*</b></span><input name="buyer_city" type="text" maxlength="100" required value="{{ (buyer_request.request_city if buyer_request else user.city) or '' }}" autocomplete="address-level2"></label>
    <label><span>نوع خرید <b>*</b></span><select name="buyer_type" required>{% set selected_type = buyer_request.buyer_type if buyer_request else 'personal' %}<option value="personal" {{ 'selected' if selected_type == 'personal' else '' }}>شخصی</option><option value="salon" {{ 'selected' if selected_type == 'salon' else '' }}>سالن</option><option value="commercial" {{ 'selected' if selected_type == 'commercial' else '' }}>تجاری</option></select></label>
    <label><span>حداقل بودجه</span><input name="budget_min" inputmode="numeric" value="{{ buyer_request.budget_min if buyer_request and buyer_request.budget_min else '' }}" placeholder="مثلاً ۵۰۰,۰۰۰ تومان"></label><label><span>حداکثر بودجه</span><input name="budget_max" inputmode="numeric" value="{{ buyer_request.budget_max if buyer_request and buyer_request.budget_max else '' }}" placeholder="مثلاً ۲,۰۰۰,۰۰۰ تومان"></label>
    <label class="is-wide"><span>توضیحات</span><textarea name="buyer_description" rows="4" maxlength="1000" placeholder="نیاز یا محدوده خرید خود را کوتاه توضیح دهید">{{ buyer_request.request_description if buyer_request else '' }}</textarea></label>
  </div>
  <section class="giso-market-rules-card" aria-label="قوانین ثبت درخواست خرید مو">
    <header><i class="fas fa-thumbtack" aria-hidden="true"></i><h3>قوانین و شرایط بازارچه موی گیسو</h3></header>
    <ol>{% for line in marketplace_terms_lines %}<li>{{ line }}</li>{% endfor %}</ol>
    <label class="giso-market-rules-check"><input type="checkbox" name="buyer_terms" value="1" required><span>قوانین را مطالعه کردم و می‌پذیرم</span></label>
  </section>
  <button class="pu-btn pu-btn-rose" type="submit" disabled><i class="fas fa-paper-plane"></i><span>{{ 'ذخیره و ارسال مجدد' if buyer_request else 'ثبت درخواست خرید' }}</span></button>
</form>
<script>
(function () {
  var form = document.querySelector('[data-buyer-request-form]');
  if (!form) return;
  var checkbox = form.querySelector('[name="buyer_terms"]');
  var submit = form.querySelector('button[type="submit"]');
  if (!checkbox || !submit) return;
  checkbox.addEventListener('change', function () { submit.disabled = !checkbox.checked; });
})();
</script>
