<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>گیسو در حال به‌روزرسانی است</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/vazirmatn.css') }}?v=6">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Vazirmatn,sans-serif;background:radial-gradient(circle at 15% 10%,#f3dfb4,transparent 30%),linear-gradient(145deg,#17120f,#533a22);color:#fff}
.card{width:min(100%,600px);overflow:hidden;text-align:center;border:1px solid rgba(230,194,108,.35);border-radius:28px;background:rgba(255,255,255,.08);box-shadow:0 28px 80px rgba(0,0,0,.35);backdrop-filter:blur(13px)}
.copy{padding:34px 26px 30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.brand-logo{width:64px;height:64px;object-fit:contain;border-radius:16px}
/* انیمیشن چرخان — CSS خالص، بدون جاوااسکریپت خارجی */
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid rgba(243,215,136,.25);border-top-color:#f3d788;animation:giso-spin 1.1s linear infinite}
@keyframes giso-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.mark{display:inline-flex;padding:5px 14px;border-radius:99px;color:#3e2b15;background:#f3d788;font-weight:700;font-size:13px}
h1{margin:0;color:#f4d784;font-size:clamp(21px,4.4vw,30px);font-weight:800;line-height:1.7}
.sub{margin:0;color:#f5ead8;font-size:15px;line-height:2}
.visual{width:min(100%,420px);max-height:230px;object-fit:cover;border-radius:18px;border:1px solid rgba(230,194,108,.35);display:block;background:#281d15}
/* تایمر بزرگ — زیر عکس */
.timer{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:2px}
.timer-digits{font-size:clamp(38px,9vw,54px);font-weight:800;color:#f3d788;letter-spacing:2px;font-variant-numeric:tabular-nums;direction:ltr}
.timer-labels{font-size:12px;color:#e9dcc2;opacity:.85}
.hint{margin:2px 0 0;color:#e9dcc2;font-size:13px;opacity:.9}
.sign{margin:6px 0 0;color:#f3d788;font-size:13px;font-weight:700;letter-spacing:.5px}
</style>
</head>
<body data-until="{{ maintenance_until or 0 }}">
<main class="card">
    <div class="copy">
        <img class="brand-logo" src="{{ url_for('static', filename='images/logo-96.webp') }}" alt="گیسو صادقی" width="96" height="96">
        <div class="spinner" aria-hidden="true"></div>
        <span class="mark">در حال به‌روزرسانی</span>
        <h1>گیسو کمی صبر می‌خواهد تا درخشان‌تر برگردد</h1>
        <p class="sub">سفارش‌ها، کیف پول و حساب شما سر جایشان می‌مانند.</p>
        <img class="visual"
             src="{{ url_for('static', filename='images/maintenance_custom.webp') }}?v={{ maintenance_image_version or '0' }}"
             onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/maintenance-default.svg') }}'"
             alt="گیسو در حال به‌روزرسانی">
        {% if maintenance_until and maintenance_until > 0 %}
        <div class="timer" id="gisoMaintTimer">
            <div class="timer-digits" id="gisoMaintDigits">--:--:--</div>
            <div class="timer-labels">ساعت : دقیقه : ثانیه</div>
        </div>
        {% endif %}
        <p class="hint">نیازی به بستن صفحه نیست</p>
        <p class="sign">گیسو صادقی</p>
    </div>
</main>
<script>
(function(){
    var until = parseInt(document.body.getAttribute('data-until') || '0', 10);
    if (!until) return;
    var el = document.getElementById('gisoMaintDigits');
    if (!el) return;
    var fa = function(s){ return String(s).replace(/\d/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'[d]; }); };
    var pad = function(n){ return (n < 10 ? '0' : '') + n; };
    function tick(){
        var left = until - Math.floor(Date.now() / 1000);
        if (left <= 0) { location.reload(); return; }
        var h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
        el.textContent = fa(pad(h) + ':' + pad(m) + ':' + pad(s));
        setTimeout(tick, 1000);
    }
    tick();
})();
</script>
</body>
</html>
