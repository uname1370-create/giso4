<div id="gisoAiWidget" class="giso-aiw is-hidden" aria-live="polite">
  <button id="gisoAiWidgetFab" class="giso-aiw-fab" type="button" aria-label="باز کردن مشاور هوشمند سایت">
    <span class="giso-aiw-fab-ring"></span>
    <img class="giso-aiw-fab-avatar" src="{{ url_for('static', filename='images/consultant_avatar.jpg') }}" alt="مشاور هوشمند گیسو" width="48" height="48" loading="lazy">
    <span id="gisoAiWidgetBadge" class="giso-aiw-badge is-hidden">جدید</span>
  </button>

  <div id="gisoAiWidgetBubble" class="giso-aiw-bubble is-hidden" role="note">
    <span class="giso-aiw-bubble-dots"><i></i><i></i><i></i></span>
    <span id="gisoAiWidgetBubbleText" class="giso-aiw-bubble-text"></span>
    <button id="gisoAiWidgetBubbleClose" class="giso-aiw-bubble-close" type="button" aria-label="بستن اعلان">×</button>
  </div>

  <section id="gisoAiWidgetPanel" class="giso-aiw-panel" hidden>
    <header class="giso-aiw-header">
      <div class="giso-aiw-titlebox">
        <strong id="gisoAiWidgetTitle">مشاور هوشمند گیسو</strong>
        <span id="gisoAiWidgetRole" class="giso-aiw-role">راهنمای سایت</span>
        <a id="gisoAiWidgetHint" class="giso-aiw-hint" href="/login" hidden></a>
      </div>
      <button id="gisoAiWidgetClose" class="giso-aiw-close" type="button" aria-label="بستن">×</button>
    </header>

    <div id="gisoAiWidgetContext" class="giso-aiw-context"></div>
    <div id="gisoAiWidgetSummary" class="giso-aiw-summary"></div>
    <div id="gisoAiWidgetMessages" class="giso-aiw-messages"></div>
    <div id="gisoAiWidgetTyping" class="giso-aiw-typing" hidden>
      <span></span><span></span><span></span>
    </div>
    <div id="gisoAiWidgetActions" class="giso-aiw-actions"></div>

    <footer class="giso-aiw-footer">
      <textarea id="gisoAiWidgetInput" rows="1" placeholder="پیامت را بنویس..."></textarea>
      <button id="gisoAiWidgetSend" type="button">ارسال</button>
    </footer>
    <div class="widget-support-hint">
      سؤال پیچیده‌تری داری؟
      {% if current_user.is_authenticated %}
      <a href="/dashboard/chats" class="widget-support-link">💬 ارتباط با پشتیبانی</a>
      {% else %}
      <a href="/login?next=/dashboard/chats" class="widget-support-link">💬 ثبت‌نام و ارتباط با پشتیبانی</a>
      {% endif %}
    </div>
  </section>
</div>
