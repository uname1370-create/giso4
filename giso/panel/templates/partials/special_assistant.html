{# دستیار اختصاصی «آقا رضا» — فقط برای ادمین اختصاصی (is_special). #}
{% if is_special %}
<section class="sp-assistant" id="spAssistant" data-current-page="{{ current_module or '' }}">
  <header class="sp-assistant-head">
    <span class="sp-assistant-ava"><i class="fas fa-robot"></i></span>
    <div>
      <b>آقا رضا <small>دستیار اختصاصی شما</small></b>
      <span class="sp-assistant-status"><i class="fas fa-circle"></i> آنلاین</span>
    </div>
    <button type="button" class="sp-assistant-toggle" id="spAssistantToggle" aria-label="باز/بسته کردن دستیار">
      <i class="fas fa-chevron-down"></i>
    </button>
  </header>
  <div class="sp-assistant-body" id="spAssistantBody">
    <div class="sp-assistant-messages" id="spAssistantMessages">
      <div class="sp-msg sp-msg-bot"><span class="sp-msg-name">آقا رضا</span><p>در حال آماده‌سازی…</p></div>
    </div>
    <div class="sp-assistant-quick" id="spAssistantQuick">
      <button type="button" data-q="وضعیت امروز سایت چطوره؟ یک گزارش کوتاه بده">📊 گزارش امروز</button>
      <button type="button" data-q="چند درخواست فروش مو منتظر بررسی است؟">💇 درخواست‌های مو</button>
      <button type="button" data-q="چند آگهی بازارچه در انتظار تایید است؟">🏪 بازارچه</button>
    </div>
    <form class="sp-assistant-form" id="spAssistantForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="message" id="spAssistantInput" maxlength="1500"
             autocomplete="off" placeholder="سوال یا درخواستتان را بنویسید…">
      <button type="submit" aria-label="ارسال"><i class="fas fa-paper-plane"></i></button>
    </form>
  </div>
</section>

<script>
(function () {
  var box = document.getElementById('spAssistant');
  if (!box) return;
  var messagesEl = document.getElementById('spAssistantMessages');
  var form = document.getElementById('spAssistantForm');
  var input = document.getElementById('spAssistantInput');
  var toggle = document.getElementById('spAssistantToggle');
  var body = document.getElementById('spAssistantBody');
  var page = box.getAttribute('data-current-page') || '';
  var busy = false;

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }
  function addMsg(role, text) {
    var wrap = document.createElement('div');
    wrap.className = 'sp-msg ' + (role === 'user' ? 'sp-msg-user' : 'sp-msg-bot');
    wrap.innerHTML = (role === 'user' ? '' : '<span class="sp-msg-name">آقا رضا</span>') + '<p>' + esc(text) + '</p>';
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function setBusy(on) {
    busy = on;
    form.querySelector('button').disabled = on;
    if (on) addMsg('bot', 'در حال فکر کردن… 🌸');
  }
  function send(text) {
    text = (text || '').trim();
    if (!text || busy) return;
    addMsg('user', text);
    setBusy(true);
    var fd = new FormData();
    fd.append('message', text);
    fd.append('page', page);
    var token = form.querySelector('input[name="csrf_token"]');
    if (token) fd.append('csrf_token', token.value);
    fetch('{{ url_for("panel.assistant_chat") }}', {
      method: 'POST',
      body: fd,
      headers: { 'X-Requested-With': 'XMLHttpRequest' }
    }).then(function (r) { return r.json(); }).then(function (data) {
      var last = messagesEl.querySelector('.sp-msg-bot:last-child');
      if (last) last.remove();
      addMsg('bot', data && data.text ? data.text : 'پاسخی دریافت نشد؛ کمی بعد دوباره بپرسید.');
    }).catch(function () {
      var last = messagesEl.querySelector('.sp-msg-bot:last-child');
      if (last) last.remove();
      addMsg('bot', 'ارتباط با دستیار برقرار نشد؛ کمی بعد دوباره تلاش کنید.');
    }).finally(function () { busy = false; form.querySelector('button').disabled = false; });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value;
    input.value = '';
    send(v);
  });
  document.querySelectorAll('#spAssistantQuick [data-q]').forEach(function (b) {
    b.addEventListener('click', function () { send(b.getAttribute('data-q')); });
  });
  toggle.addEventListener('click', function () {
    box.classList.toggle('is-collapsed');
  });

  // بارگیری تاریخچه + پیام خوش‌آمد متناسب با صفحه
  fetch('{{ url_for("panel.assistant_history") }}?page=' + encodeURIComponent(page), {
    headers: { 'X-Requested-With': 'XMLHttpRequest' }
  }).then(function (r) { return r.json(); }).then(function (data) {
    messagesEl.innerHTML = '';
    var hist = (data && data.history) || [];
    if (hist.length) {
      hist.forEach(function (h) { addMsg(h.role === 'assistant' ? 'bot' : 'user', h.content); });
    } else if (data && data.welcome) {
      addMsg('bot', data.welcome);
    }
    // هوشمندی صفحه: با ورود به هر بخش، یک بار پیام متناسب آن صفحه نشان داده می‌شود.
    try {
      var seen = JSON.parse(sessionStorage.getItem('spIntroSeen') || '{}');
      if (page && data && data.page_intro && !seen[page]) {
        addMsg('bot', data.page_intro);
        seen[page] = true;
        sessionStorage.setItem('spIntroSeen', JSON.stringify(seen));
      }
    } catch (e) { if (data && data.page_intro && page) addMsg('bot', data.page_intro); }
  }).catch(function () { addMsg('bot', 'سلام خانم مهندس! 🌸 من آقا رضا هستم.'); });
})();
</script>
{% endif %}
