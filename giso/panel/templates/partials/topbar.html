<header class="pnl-topbar">
    <button class="pnl-burger" id="pnlBurger" aria-label="باز کردن منو"><i class="fas fa-bars"></i></button>
    <div class="pnl-topbar-title">
        <span class="pnl-topbar-crumb">پنل مدیریت</span>
        <strong>{{ current_module_label or current_module }}</strong>
    </div>
    <div class="pnl-topbar-actions">
        <a href="{{ url_for('panel.dashboard') }}" class="pnl-btn pnl-btn-outline pnl-btn-sm" title="پیشخوان پنل">📊 پیشخوان</a>
        <span class="pnl-role-chip">{% if is_super %}👑 سوپرادمین{% elif role == 'special' %}🌸 ادمین اختصاصی{% else %}🛡 ادمین{% endif %}</span>
        <div class="pnl-bell" id="pnlBell" data-unread="{{ notif_unread|default(0) }}">
            <button type="button" class="pnl-bell-btn {{ 'has-unread' if notif_unread|default(0) > 0 else '' }}"
                    id="pnlBellBtn" aria-label="اعلان‌ها" aria-haspopup="true">
                <i class="fas fa-bell"></i>
                <span class="pnl-bell-count" id="pnlBellCount"
                      {% if not notif_unread|default(0) > 0 %}style="display:none"{% endif %}>{{ notif_unread|default(0) }}</span>
            </button>
            <div class="pnl-bell-drop" id="pnlBellDrop" hidden>
                <div class="pnl-bell-drop-head">
                    <span><i class="fas fa-bell"></i> آخرین اعلان‌ها</span>
                    {% if is_super %}<a href="{{ url_for('panel.notifications') }}">مشاهده همه</a>{% else %}<a href="{{ url_for('panel.dashboard') }}">پیشخوان کار من</a>{% endif %}
                </div>
                <div class="pnl-bell-drop-body" id="pnlBellDropBody">
                    <div class="pnl-bell-loading">در حال دریافت…</div>
                </div>
            </div>
        </div>
    </div>
</header>
