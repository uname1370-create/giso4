# ═══════════════════════════════════════════════════════════════════════
# nginx — سایت و پنل گیسو (پروکسی معکوس به Waitress روی پورت 5001)
# نصب: sudo cp deploy/nginx-giso.conf /etc/nginx/sites-available/giso
#      sudo ln -s /etc/nginx/sites-available/giso /etc/nginx/sites-enabled/giso
#      sudo nginx -t && sudo systemctl reload nginx
#
# نیازمندی ماژول brotli (اختیاری ولی توصیه‌شده):
#   sudo apt install nginx-module-brotli   (یا از سورس: ngx_brotli)
#   اگر نصب نبود، دو خط brotli را کامنت کنید — gzip به‌تنهایی هم کافی است.
#
# گواهی SSL: بخش ۴۴۳ آماده است؛ بعد از certbot (گام ۶ UBUNTU_SETUP.md)
# مسیرهای fullchain/privkey را certbot خودش پر می‌کند.
# ═══════════════════════════════════════════════════════════════════════

# ── فشرده‌سازی در سطح http (اگر در nginx.conf نیست) ──────────────────
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml image/svg+xml font/woff2;

# brotli (در صورت نصب ماژول) — برای متن‌ها قوی‌تر از gzip
brotli on;
brotli_comp_level 6;
brotli_min_length 1024;
brotli_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml image/svg+xml font/woff2;

# ── HTTP → HTTPS ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name gisosadeghi.ir www.gisosadeghi.ir;

    # مسیر چالش Let's Encrypt (بدون redirect تا certbot کار کند)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS + HTTP/2 ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx ≥ 1.25 — برای نسخه‌های قدیمی:
                                    # listen 443 ssl http2;
    server_name gisosadeghi.ir www.gisosadeghi.ir;

    # ── گواهی SSL (Let's Encrypt — certbot این‌ها را پر می‌کند) ──
    ssl_certificate     /etc/letsencrypt/live/gisosadeghi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gisosadeghi.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── هدرهای امنیتی ────────────────────────────────────────────────
    # HSTS فقط بعد از فعال‌شدن HTTPS معتبر (اول با max-age کوتاه تست کنید)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # حجم آپلود — هم‌راستا با MAX_CONTENT_LENGTH=16MB در giso/config.py:55
    client_max_body_size 16m;

    # ── Reverse Proxy به Waitress (پورت 5001) ────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # هدرهای پروکسی — security.py:152 برای لاگ IP واقعی همین را می‌خواند
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # پشتیبانی WebSocket/ارتقای پروتکل (برای ارتقا‌های آتی)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # تایم‌اوت‌ها — چت AI ممکن است تا ~60s طول بکشد
        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;
        proxy_buffering       off;   # پاسخ‌های stream چت AI بافر نشوند
    }

    # ── فایل‌های static: کش ۳۰ روزه مستقیم از دیسک (بدون عبور از پایتون) ──
    # مسیر پروژه را با مسیر واقعی سرور تنظیم کنید (پیش‌فرض: /home/rs2013/sadeghiai)
    location /static/ {
        alias /home/rs2013/sadeghiai/giso/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
}
