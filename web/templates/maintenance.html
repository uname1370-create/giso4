<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه در حال به‌روزرسانی است</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 85% 10%,#d9e7f7,transparent 32%),linear-gradient(145deg,#0d1930,#254773);color:#fff}.card{width:min(100%,760px);overflow:hidden;text-align:center;border:1px solid rgba(225,189,98,.35);border-radius:28px;background:rgba(255,255,255,.08);box-shadow:0 28px 80px rgba(0,0,0,.32);backdrop-filter:blur(13px)}.visual{width:100%;aspect-ratio:12/5;object-fit:cover;display:block;background:#172a47}.copy{padding:27px 22px 32px}h1{margin:0 0 10px;color:#f0cd76;font-size:clamp(25px,5vw,40px)}p{margin:0;color:#e5eefb;font-size:16px;line-height:2}.mark{display:inline-flex;margin-bottom:9px;padding:5px 12px;border-radius:99px;color:#173151;background:#f0d084;font-weight:700;font-size:13px}</style></head><body><main class="card"><img class="visual" src="{{ url_for('static',filename='images/maintenance_custom.webp') }}?v={{ maintenance_image_version or '0' }}" onerror="this.onerror=null;this.src='{{ url_for('static',filename='images/maintenance-default.svg') }}'" alt="سامانه آموزش در حال به‌روزرسانی"><div class="copy"><span class="mark">سامانه آموزش صادقی</span><h1>در حال بهبود تجربه آموزشی هستیم</h1><p>برای ارائه امکانات بهتر، سامانه برای مدت کوتاهی در حال به‌روزرسانی است.<br>لطفاً کمی بعد دوباره مراجعه کنید.</p></div></main></body></html>
