{% extends "base.html" %}
{% block title %}{{ feature_name }} - پنل ادمین{% endblock %}
{% block content %}
<section class="page-section admin-section">
<div class="container">
    <div class="page-header">
        <h1><i class="fas fa-robot"></i> {{ feature_name }}</h1>
        <p class="page-sub">این بخش از پنل در حال حاضر در وب پیاده‌سازی نشده و از طریق <strong>ربات بله</strong> مدیریت می‌شود.</p>
    </div>

    <div class="note info note-lg">
        <i class="fas fa-location-arrow"></i>
        <span>
            مسیر در ربات:
            <code class="bot-path-code">{{ bot_path }}</code>
        </span>
    </div>

    <div class="mt-30">
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-primary"><i class="fas fa-arrow-right"></i> بازگشت به پیشخوان مدیریت</a>
    </div>
</div>
</section>
{% endblock %}
